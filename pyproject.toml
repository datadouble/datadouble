# Workspace root. Not a published package: it holds the shared development
# tooling configuration and the list of workspace members (the core package
# and, from M1 on, one package per adapter).

[project]
name = "datadouble-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

# The number of checker suppressions allowed in the repository; see
# scripts/check_source.py. Raising it needs a reason in the pull request.
[tool.datadouble]
suppressions = 26

[tool.uv.workspace]
members = [
    "core",
    "adapters/btrfs",
    "adapters/docker",
    "adapters/kubernetes",
    "adapters/mongodb",
    "adapters/mssql",
    "adapters/mysql",
    "adapters/oracle",
    "adapters/postgres",
    "adapters/redis",
    "adapters/s3",
    "adapters/vault",
    "conformance",
]

[tool.uv.sources]
datadouble = { workspace = true }
datadouble-mssql = { workspace = true }
datadouble-mysql = { workspace = true }
datadouble-oracle = { workspace = true }
datadouble-postgres = { workspace = true }
datadouble-redis = { workspace = true }
datadouble-conformance = { workspace = true }
datadouble-s3 = { workspace = true }
datadouble-docker = { workspace = true }
datadouble-vault = { workspace = true }
datadouble-kubernetes = { workspace = true }
datadouble-btrfs = { workspace = true }
datadouble-mongodb = { workspace = true }

[dependency-groups]
dev = [
    "datadouble",
    "datadouble-btrfs",
    "datadouble-conformance",
    "datadouble-docker",
    "datadouble-kubernetes",
    "datadouble-mongodb",
    "datadouble-mssql",
    "datadouble-mysql",
    "datadouble-oracle",
    "datadouble-postgres",
    "datadouble-redis",
    "datadouble-s3",
    "datadouble-vault",
    "boto3-stubs[s3]>=1.43.126",
    "mypy>=1.18",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
    "ruff>=0.13",
    "types-pymysql>=1.1.0",
    "types-pyyaml>=6.0.12",
]
docs = ["zensical==0.1.1"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["INP001"]  # standalone scripts, not a package
"conformance/**" = [
    "PLR0913",  # test builders take many keyword arguments with defaults
    "PLR2004",  # literal values are the point of a test
    "S101",     # pytest uses assert
]
"**/tests/**" = [
    "INP001",   # test directories are not packages
    "ARG002",   # test doubles ignore inputs they don't need
    "D",        # test names say what they check
    "FBT001",   # parametrized tests take positional booleans
    "PLR0911",  # test doubles mirror the branching of what they stand in for
    "PLR0913",  # test builders take many keyword arguments with defaults
    "PLR0917",  # ... some of them positional
    "PLR2004",  # literal values are the point of a test
    "S101",     # pytest uses assert
    "S603",     # tests run fixed commands to set up fixtures
    "S607",     # ... found on PATH
]

[tool.ruff.lint.isort]
known-first-party = [
    "datadouble",
    "datadouble_btrfs",
    "datadouble_conformance",
    "datadouble_docker",
    "datadouble_kubernetes",
    "datadouble_mongodb",
    "datadouble_mssql",
    "datadouble_mysql",
    "datadouble_oracle",
    "datadouble_postgres",
    "datadouble_redis",
    "datadouble_s3",
    "datadouble_vault",
    "check_source",
    "make_tag",
    "check_coverage",
    "check_workflows",
    "sakila_bulk",
    "fakes",
    "fake_engine",
    "test_conformance",
    "test_mongodb_conformance",
    "test_mssql_conformance",
    "test_mysql_conformance",
    "test_oracle_conformance",
    "test_redis_conformance",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = [
    "core/src",
    "core/tests",
    "adapters/btrfs/src",
    "adapters/btrfs/tests",
    "adapters/docker/src",
    "adapters/docker/tests",
    "adapters/kubernetes/src",
    "adapters/kubernetes/tests",
    "adapters/mongodb/src",
    "adapters/mongodb/tests",
    "adapters/mssql/src",
    "adapters/mssql/tests",
    "adapters/mysql/src",
    "adapters/mysql/tests",
    "adapters/oracle/src",
    "adapters/oracle/tests",
    "adapters/postgres/src",
    "adapters/postgres/tests",
    "adapters/redis/src",
    "adapters/redis/tests",
    "adapters/s3/src",
    "adapters/s3/tests",
    "adapters/vault/src",
    "adapters/vault/tests",
    "conformance/src",
    "conformance/tests",
    "scripts",
    "tests",
]
mypy_path = "core/src:core/tests:adapters/btrfs/src:adapters/docker/src:adapters/kubernetes/src:adapters/mongodb/src:adapters/mongodb/tests:adapters/mssql/src:adapters/mssql/tests:adapters/mysql/src:adapters/mysql/tests:adapters/oracle/src:adapters/oracle/tests:adapters/postgres/src:adapters/postgres/tests:adapters/redis/src:adapters/redis/tests:adapters/s3/src:adapters/vault/src:conformance/src:scripts"
explicit_package_bases = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "core/src",
    "core/tests",
    "adapters/btrfs/src",
    "adapters/btrfs/tests",
    "adapters/docker/src",
    "adapters/docker/tests",
    "adapters/kubernetes/src",
    "adapters/kubernetes/tests",
    "adapters/mongodb/src",
    "adapters/mongodb/tests",
    "adapters/mssql/src",
    "adapters/mssql/tests",
    "adapters/mysql/src",
    "adapters/mysql/tests",
    "adapters/oracle/src",
    "adapters/oracle/tests",
    "adapters/postgres/src",
    "adapters/postgres/tests",
    "adapters/redis/src",
    "adapters/redis/tests",
    "adapters/s3/src",
    "adapters/s3/tests",
    "adapters/vault/src",
    "adapters/vault/tests",
    "conformance/src",
    "conformance/tests",
    "scripts",
    "tests",
]
extraPaths = ["scripts", "core/tests", "adapters/mongodb/tests", "adapters/mssql/tests", "adapters/mysql/tests", "adapters/oracle/tests", "adapters/postgres/tests", "adapters/redis/tests"]
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "adapters/btrfs/tests",
    "adapters/docker/tests",
    "adapters/kubernetes/tests",
    "adapters/mongodb/tests",
    "adapters/mssql/tests",
    "adapters/mysql/tests",
    "adapters/oracle/tests",
    "adapters/postgres/tests",
    "adapters/redis/tests",
    "adapters/s3/tests",
    "adapters/vault/tests",
    "conformance/tests",
    "tests",
]
pythonpath = ["scripts", "adapters/postgres/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A hung test fails with its stack, well inside the CI job's own time limit.
timeout = 600
# Working databases' files fill tmp_path: keep only failed tests' directories,
# or a group's run outgrows the runner's disk.
tmp_path_retention_policy = "failed"
markers = [
    "integration: needs the Docker Compose services (run with `make test-integration`)",
    "k8s: needs the k8s Compose profile (run with `make test-k8s`)",
    "btrfs: needs the btrfs Compose profile (run with `make test-btrfs`)",
]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true  # reports name files from the repository root, wherever they ran
# Roots are src directories, so reports name files by package
# (datadouble_mongodb/working.py) and no two files share a name.
source = [
    "core/src",
    "adapters/btrfs/src",
    "adapters/docker/src",
    "adapters/kubernetes/src",
    "adapters/mongodb/src",
    "adapters/mssql/src",
    "adapters/mysql/src",
    "adapters/oracle/src",
    "adapters/postgres/src",
    "adapters/redis/src",
    "adapters/s3/src",
    "adapters/vault/src",
    "conformance/src",
    "scripts",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "assert_never\\(",
]
