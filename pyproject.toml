# Workspace root. Not a published package: it holds the shared development
# tooling configuration and the list of workspace members (the core package
# and, from M1 on, one package per adapter).

[project]
name = "datadouble-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "adapters/postgres", "adapters/s3", "conformance"]

[tool.uv.sources]
datadouble = { workspace = true }
datadouble-postgres = { workspace = true }
datadouble-conformance = { workspace = true }
datadouble-s3 = { workspace = true }

[dependency-groups]
dev = [
    "datadouble",
    "datadouble-conformance",
    "datadouble-postgres",
    "datadouble-s3",
    "boto3-stubs[s3]>=1.40",
    "mypy>=1.18",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12",
]
docs = ["zensical==0.1.1"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["INP001"]  # standalone scripts, not a package
"conformance/**" = [
    "PLR0913",  # test builders take many keyword arguments with defaults
    "PLR2004",  # literal values are the point of a test
    "S101",     # pytest uses assert
]
"**/tests/**" = [
    "INP001",   # test directories are not packages
    "ARG002",   # test doubles ignore inputs they don't need
    "D",        # test names say what they check
    "FBT001",   # parametrized tests take positional booleans
    "PLR0911",  # test doubles mirror the branching of what they stand in for
    "PLR0913",  # test builders take many keyword arguments with defaults
    "PLR0917",  # ... some of them positional
    "PLR2004",  # literal values are the point of a test
    "S101",     # pytest uses assert
    "S603",     # tests run fixed commands to set up fixtures
    "S607",     # ... found on PATH
]

[tool.ruff.lint.isort]
known-first-party = [
    "datadouble",
    "datadouble_conformance",
    "datadouble_postgres",
    "datadouble_s3",
    "check_source",
    "make_tag",
    "fakes",
    "fake_engine",
    "test_conformance",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = [
    "core/src",
    "core/tests",
    "adapters/postgres/src",
    "adapters/postgres/tests",
    "adapters/s3/src",
    "adapters/s3/tests",
    "conformance/src",
    "scripts",
    "tests",
]
mypy_path = "core/src:core/tests:adapters/postgres/src:adapters/postgres/tests:adapters/s3/src:conformance/src:scripts"
explicit_package_bases = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "core/src",
    "core/tests",
    "adapters/postgres/src",
    "adapters/postgres/tests",
    "adapters/s3/src",
    "adapters/s3/tests",
    "conformance/src",
    "scripts",
    "tests",
]
extraPaths = ["scripts", "core/tests", "adapters/postgres/tests"]
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["core/tests", "adapters/postgres/tests", "adapters/s3/tests", "tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: needs the Docker Compose services (run with `make test-integration`)",
]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true  # reports name files from the repository root, wherever they ran
source = [
    "core/src/datadouble",
    "adapters/postgres/src/datadouble_postgres",
    "adapters/s3/src/datadouble_s3",
    "scripts",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "assert_never\\(",
]
