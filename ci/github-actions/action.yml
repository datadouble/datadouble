# Runs one datadouble command in the Datadouble image and reports it to
# GitHub Actions. Workflows written by `datadouble ci init --system
# github-actions` use it; see this directory's README.

name: Datadouble
description: Run a Datadouble command in the Datadouble image, as the engine's user
author: Tight Line LLC
branding:
  icon: copy
  color: blue

inputs:
  arguments:
    description: The datadouble command line after the global options, one argument per line
    required: true
  image:
    description: The Datadouble image, pinned to a release
    required: true
  user:
    description: The uid:gid Datadouble runs as, the engine's owner
    required: true
  mounts:
    description: Host paths the spec names, one per line, mounted at the same path
    required: false
    default: ""
  environment:
    description: Environment variables the spec reads secrets from, one name per line
    required: false
    default: ""
  artifacts:
    description: A workspace directory the command writes files into for the workflow to publish, emptied first and made writable by the engine's user
    required: false
    default: ""

outputs:
  outcome:
    description: success, warning or failure
    value: ${{ steps.datadouble.outputs.outcome }}
  generation:
    description: The generation a run built
    value: ${{ steps.datadouble.outputs.generation }}
  error:
    description: The error code of a failure
    value: ${{ steps.datadouble.outputs.error }}
  fingerprint:
    description: The new catalog lock's fingerprint, for lock
    value: ${{ steps.datadouble.outputs.fingerprint }}
  changes:
    description: How many changes the new lock has from the earlier one, for lock
    value: ${{ steps.datadouble.outputs.changes }}

runs:
  using: composite
  steps:
    - name: datadouble
      id: datadouble
      shell: bash
      env:
        DATADOUBLE_ARGUMENTS: ${{ inputs.arguments }}
        DATADOUBLE_IMAGE: ${{ inputs.image }}
        DATADOUBLE_USER: ${{ inputs.user }}
        DATADOUBLE_MOUNTS: ${{ inputs.mounts }}
        DATADOUBLE_ENVIRONMENT: ${{ inputs.environment }}
        DATADOUBLE_ARTIFACTS: ${{ inputs.artifacts }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
