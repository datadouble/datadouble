# The job template every job `datadouble ci init --system gitlab` writes
# extends. Generated configuration includes it from this repository at the
# release's tag, pinned by its SHA-256 (`include: remote` with `integrity`).
#
# It runs one datadouble command in the Datadouble image as the engine's user
# (decision 86), on the host's network, with the runner's Docker daemon for
# the engines' containers and the project directory and the spec's host paths
# at the same paths, since engine containers mount them by those paths. Jobs
# therefore need a runner whose shell executor has Docker. DATADOUBLE_DOCKER
# and DATADOUBLE_DOCKER_SOCKET name another Docker command and the daemon's
# socket (decision 126); the socket is mounted at /var/run/docker.sock
# inside. The command writes its outputs (outcome, generation, error code:
# never data) into datadouble.env, a dotenv report that later jobs read and a
# file people can download; a warning exits with 3, which `allow_failure:
# exit_codes` shows as a warning. A job that publishes files for review (the
# lock job's new lock and its changes) names their directory in
# DATADOUBLE_ARTIFACTS, which is emptied and made writable by the engine's
# user, and adds it to its artifacts' paths. DATADOUBLE_CI_JOB names the
# generated job, so the command posts the spec's notify webhooks itself,
# linking the job's page (CI_JOB_URL).

.datadouble:
  allow_failure:
    exit_codes: [3]
  artifacts:
    when: always
    paths: [datadouble.env]
    reports:
      dotenv: datadouble.env
  script:
    - |
      set -euo pipefail
      mapfile -t arguments < <(printf '%s\n' "$DATADOUBLE_ARGUMENTS" | sed '/^[[:space:]]*$/d')
      bridge=$(mktemp -d "$CI_PROJECT_DIR/.datadouble-ci.XXXXXX")
      trap 'rm -rf "$bridge"' EXIT
      chmod 0777 "$bridge"
      : > datadouble.env
      docker=${DATADOUBLE_DOCKER:-docker}
      # The daemon's socket: DATADOUBLE_DOCKER_SOCKET, else a unix:// DOCKER_HOST, else
      # Docker's default. A socket other than the default is also the daemon the
      # image is started on (DOCKER_HOST, and podman's CONTAINER_HOST), so the image
      # and the engines' containers share one daemon and one set of paths.
      socket=${DATADOUBLE_DOCKER_SOCKET:-}
      if [ -z "$socket" ] && [[ "${DOCKER_HOST:-}" == unix://* ]]; then socket=${DOCKER_HOST#unix://}; fi
      if [ -n "$socket" ]; then export DOCKER_HOST="unix://$socket" CONTAINER_HOST="unix://$socket"; fi
      socket=${socket:-/var/run/docker.sock}
      if [ ! -S "$socket" ]; then
          echo "error: no Docker socket at $socket; set DATADOUBLE_DOCKER_SOCKET to the daemon's socket"
          exit 1
      fi
      options=(
          --rm --network host
          --user "$DATADOUBLE_USER" --group-add "$(stat -L -c %g "$socket")"
          --volume "$socket:/var/run/docker.sock"
          --env DOCKER_HOST=unix:///var/run/docker.sock --env CONTAINER_HOST=unix:///var/run/docker.sock
          --volume "$CI_PROJECT_DIR:$CI_PROJECT_DIR" --workdir "$CI_PROJECT_DIR"
          --env HOME=/tmp
          --env DATADOUBLE_BOUNDARY --env CI_RUNNER_TAGS --env CI_JOB_URL
      )
      bridged=(--ci gitlab --ci-directory "$bridge")
      if [ -n "${DATADOUBLE_CI_JOB:-}" ]; then bridged+=(--ci-job "$DATADOUBLE_CI_JOB"); fi
      # Docker would create a missing path as root, which the engine's user
      # cannot write, so a path the runner lacks fails here.
      while IFS= read -r path; do
          if [ -z "$path" ]; then continue; fi
          if [ ! -e "$path" ]; then
              echo "error: $path does not exist on this runner; create it, owned by $DATADOUBLE_USER"
              exit 1
          fi
          options+=(--volume "$path:$path")
      done <<< "${DATADOUBLE_MOUNTS:-}"
      while IFS= read -r name; do
          # Inside, the daemon is always the socket mounted at /var/run/docker.sock.
          case "$name" in ""|DOCKER_HOST|CONTAINER_HOST) continue ;; esac
          options+=(--env "$name")
      done <<< "${DATADOUBLE_ENVIRONMENT:-}"
      if [ -n "${DATADOUBLE_ARTIFACTS:-}" ]; then
          rm -rf "${CI_PROJECT_DIR:?}/$DATADOUBLE_ARTIFACTS"
          mkdir -p "$CI_PROJECT_DIR/$DATADOUBLE_ARTIFACTS"
          chmod 0777 "$CI_PROJECT_DIR/$DATADOUBLE_ARTIFACTS"
      fi
      status=0
      "$docker" run "${options[@]}" "$DATADOUBLE_IMAGE" "${bridged[@]}" "${arguments[@]}" || status=$?
      if [ -f "$bridge/outputs" ]; then cat "$bridge/outputs" > datadouble.env; fi
      exit "$status"
