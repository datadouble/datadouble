# The spec and its catalog lock, as ci init copied them into the values.
{{- if not .Values.owner }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datadouble.name" . }}
data:
  spec: {{ .Values.spec.content | quote }}
  lock: {{ .Values.spec.lock | quote }}
{{- end }}
