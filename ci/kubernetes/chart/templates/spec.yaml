# The spec, the specs it extends and its catalog lock, as ci init copied them
# into the values. A ConfigMap key can't hold a path, so each file is keyed by
# its place in the sorted list of paths.
{{- if not .Values.owner }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datadouble.name" . }}
data:
  {{- range $index, $path := keys .Values.spec.files | sortAlpha }}
  {{ printf "spec-%d" $index }}: {{ index $.Values.spec.files $path | quote }}
  {{- end }}
  lock: {{ .Values.spec.lock | quote }}
{{- end }}
