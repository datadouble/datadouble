# `datadouble ci init --system argocd` writes these values; see the README.

# The side's name, which its CronJobs, service account and spec ConfigMap
# carry; a request's Application uses the side's, by this name.
name: ""

# The Datadouble image, pinned to a release.
image: ghcr.io/datadouble/datadouble:v0.0.0
# The uid and gid Datadouble runs as: the engine's owner (decision 86).
user: {uid: 999, gid: 999}
# The spec and its catalog lock, mounted where the jobs' arguments find them.
spec: {path: datadouble/spec.yml, content: "", lock: ""}
# The PersistentVolumeClaim every path the spec names lives on, mounted at
# the same path in every pod (the `kubernetes` runtime's claim and mount).
claim: {name: datadouble, mount: /srv/datadouble}
# A Secret holding the environment variables the jobs read secrets from.
secret: ""
# Who on-demand copies are for; an ApplicationSet sets it per request. An
# Application with an owner renders only that request's hook Jobs, which use
# the side's service account and spec, so the side's Application must be in
# the same namespace.
owner: ""
# The generation `activate` points the staging channel at, and whether
# `prune` only reports what it would remove.
generation: ""
dryRun: false
# Give the service account read access to PersistentVolumes and the right to
# make them, for the `k8s-pv` replicate adapter.
persistentVolumes: false
# Each job: its CronJob's schedule (UTC; none means suspended, started by
# hand with `kubectl create job --from`), its time limit, the steps it runs
# in order, and for each step the generated job it belongs to (which posts
# the spec's notify webhooks) and the environment variables it reads secrets
# from. `hook`
# jobs run for a request instead: PreSync makes copies, PostDelete releases.
# `artifacts` names a workspace directory the job writes files into for
# review (the lock job's new lock and changes), an emptyDir; the job prints
# them to its log.
jobs: []
