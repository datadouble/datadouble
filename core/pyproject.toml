[project]
name = "datadouble"
# All packages share one version until 1.0 (decision 38); scripts/make_tag.py
# sets it at release time.
version = "0.0.0"
description = "Realistic, safe copies of production data for development and testing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tight Line LLC" }]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://datadouble.tightlinesoftware.com/"
Source = "https://github.com/datadouble/datadouble"
Changelog = "https://github.com/datadouble/datadouble/blob/main/CHANGELOG.md"

[project.scripts]
datadouble = "datadouble.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datadouble"]
