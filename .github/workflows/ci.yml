name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # setup-uv downloads uv and CPython from GitHub release assets; uv
          # resolves packages from PyPI.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the workspace
        run: uv sync --frozen

      - name: Lint and source conventions
        run: make lint

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${file}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum --check
          tar xzf "${file}" actionlint
          sudo install actionlint /usr/local/bin/

      - name: Lint workflows
        run: make lint-workflows

      - name: Type checks
        run: make typecheck

      - name: Unit tests (100% coverage gate)
        run: make test

  integration:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload with OpenID Connect
    env:
      # Empty on Dependabot and fork runs, which get no secrets.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # Docker Hub (and its Cloudflare blob storage) for the PostgreSQL and
          # Python base images, GHCR for the uv image, Debian for git in the
          # test image, PyPI for the workspace, Codecov for the upload.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            *.r2.cloudflarestorage.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            deb.debian.org:80
            deb.debian.org:443
            pypi.org:443
            files.pythonhosted.org:443
            cli.codecov.io:443
            ingest.codecov.io:443
            api.codecov.io:443
            *.ingest.us.sentry.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the suite in the default Compose group
        run: make test-integration

      # The coverage gate runs inside the suite; the upload is telemetry, so it
      # never fails the job.
      - name: Upload coverage (OpenID Connect)
        if: ${{ env.SAME_REPO == 'true' && hashFiles('.reports/coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./.reports/coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload coverage (token, for forks)
        if: ${{ env.SAME_REPO != 'true' && env.CODECOV_TOKEN != '' && hashFiles('.reports/coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./.reports/coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build the site (fails on broken links)
        run: make docs
