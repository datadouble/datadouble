# Generated by `datadouble ci init` (Datadouble 0.0.2). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble nightly promote
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Datadouble nightly build
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datadouble-nightly-promote
  cancel-in-progress: false
jobs:
  promote:
    name: promote
    runs-on:
      - self-hosted
      - datadouble-nightly
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble promote
        uses: ./ci/github-actions # zizmor: ignore[self-repository]
        with:
          job: promote
          image: datadouble:nightly
          user: 999:999
          mounts: |
            /var/tmp/datadouble-nightly/export
            /var/tmp/datadouble-nightly/store
          arguments: |
            promote
            --spec
            tests/nightly/nightly.yml
