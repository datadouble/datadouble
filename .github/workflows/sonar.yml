name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read  # pull request analysis reads its metadata
    env:
      # Empty on Dependabot and fork runs, which get no secrets.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # binaries.sonarsource.com serves the scanner, which the action caches,
          # so a missing endpoint only shows when the cache goes cold. The action
          # verifies the scanner's signature with keys from the two keyservers.
          # The Compose suite needs what CI's integration job does: Docker Hub,
          # GHCR, Debian and dl.k8s.io (kubectl).
          allowed-endpoints: >
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            *.r2.cloudflarestorage.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            deb.debian.org:80
            deb.debian.org:443
            dl.k8s.io:443
            cdn.dl.k8s.io:443
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            api.sonarcloud.io:443
            scanner.sonarcloud.io:443
            binaries.sonarsource.com:443
            keyserver.ubuntu.com:443
            keys.openpgp.org:443
            analysis-sensorcache-eu-central-1-prod.s3.eu-central-1.amazonaws.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for blame and new-code detection

      # The runner image ships MySQL with an AppArmor profile for
      # /usr/sbin/mysqld. Containers that Docker-in-Docker starts run without
      # a profile of their own, so the host's attaches to their mysqld by path
      # and stops it writing working databases under /work. The runner is
      # throwaway and its MySQL is never used; see TESTING.md to remove this.
      - name: Unload the runner's MySQL AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/usr.sbin.mysqld
          fi

      # Adapter code is only reachable with databases running, so coverage
      # comes from the whole suite in the Compose default group. The report
      # must name every analysed file exactly once, or the scanner counts it
      # as uncovered. Its source roots are repository-relative, which the
      # scanner reads as absolute, so they are anchored to the checkout.
      - name: Tests with coverage (Docker Compose)
        run: |
          make test-integration
          python3 scripts/check_coverage.py .reports/coverage.xml sonar-project.properties
          sed -E "s#<source>([^/<][^<]*)</source>#<source>${GITHUB_WORKSPACE}/\1</source>#" \
            .reports/coverage.xml > coverage.xml

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
