# Generated by `datadouble ci init` (Datadouble 0.0.0). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble nightly build
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: datadouble-nightly-build
  cancel-in-progress: false
jobs:
  build:
    name: build
    runs-on:
      - self-hosted
      - datadouble-nightly
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble run
        uses: ./ci/github-actions # zizmor: ignore[self-repository]
        env:
          DATADOUBLE_NIGHTLY_DSN: ${{ secrets.DATADOUBLE_NIGHTLY_DSN }}
        with:
          job: build
          image: datadouble:nightly
          user: 999:999
          mounts: |
            /var/tmp/datadouble-nightly/store
            /var/tmp/datadouble-nightly/work
          environment: |
            DATADOUBLE_NIGHTLY_DSN
          arguments: |
            run
            plan,extract,load,transform,package,verify,store
            --spec
            tests/nightly/nightly.yml
            --work
            /var/tmp/datadouble-nightly/work
            --retry-key
            ${{ github.run_id }}
