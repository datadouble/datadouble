# Generated by `datadouble ci init` (Datadouble 0.0.0). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble nightly prune-production
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would be removed, without removing it
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: datadouble-nightly-prune-production
  cancel-in-progress: false
jobs:
  prune:
    name: prune
    runs-on:
      - self-hosted
      - datadouble-nightly
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble prune
        uses: ./ci/github-actions # zizmor: ignore[self-repository]
        with:
          image: datadouble:nightly
          user: 999:999
          mounts: |
            /var/tmp/datadouble-nightly/export
            /var/tmp/datadouble-nightly/store
          arguments: |
            prune
            --spec
            tests/nightly/nightly.yml
            --target
            store
            ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: datadouble prune
        uses: ./ci/github-actions # zizmor: ignore[self-repository]
        with:
          image: datadouble:nightly
          user: 999:999
          mounts: |
            /var/tmp/datadouble-nightly/export
            /var/tmp/datadouble-nightly/store
          arguments: |
            prune
            --spec
            tests/nightly/nightly.yml
            --target
            export
            ${{ inputs.dry-run && '--dry-run' || '' }}
