# Generated by `datadouble ci init` (Datadouble 0.0.2). Change the spec or
# the options and generate it again, rather than editing it by hand.
name: Datadouble nightly fetch
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datadouble-nightly-fetch
  cancel-in-progress: false
jobs:
  fetch:
    name: fetch
    runs-on:
      - self-hosted
      - datadouble-nightly
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: datadouble fetch
        uses: ./ci/github-actions # zizmor: ignore[self-repository]
        with:
          job: fetch
          image: datadouble:nightly
          user: 999:999
          mounts: |
            /var/tmp/datadouble-nightly/export
            /var/tmp/datadouble-nightly/staging
          arguments: |
            fetch
            --spec
            tests/nightly/nightly.yml
