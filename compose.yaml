# The integration suite's services. `make test-integration` and
# `make test-group GROUP=...` start only the ones the groups being run need
# (tests/integration-groups.txt); the privileged k8s and btrfs groups are
# profiles. compose.host.yaml points the tests at the host's own Docker daemon
# instead of the Docker-in-Docker one, as CI does. See TESTING.md.

name: datadouble

services:
  test:
    build:
      context: .
      target: test
    # No depends_on: `make` starts only the services the groups being run
    # need (tests/integration-groups.txt), and waits for them to be healthy.
    environment:
      DATADOUBLE_TEST_POSTGRES_DSN: postgresql://datadouble:datadouble@postgres:5432/datadouble
      DATADOUBLE_TEST_MONGODB_URI: mongodb://mongodb:27017/cinema?replicaSet=rs0
      DATADOUBLE_TEST_MYSQL_URL: mysql://datadouble:datadouble@mysql:3306/sakila
      DATADOUBLE_TEST_MSSQL_URL: mssql://datadouble:Datadouble-1@mssql:1433/sakila
      DATADOUBLE_TEST_S3_ENDPOINT: http://s3:8333
      # SeaweedFS accepts any credentials when it has no identities configured.
      AWS_ACCESS_KEY_ID: datadouble
      AWS_SECRET_ACCESS_KEY: datadouble
      AWS_DEFAULT_REGION: us-east-1
      # Containers the Docker adapter makes go to a Docker-in-Docker daemon,
      # never to the host's.
      DOCKER_HOST: tcp://docker:2375
      DATADOUBLE_TEST_DOCKER_ADDRESS: docker
      DATADOUBLE_TEST_RUNTIME: '{"docker": {"publish": "0.0.0.0", "address": "docker"}}'
      # Engine containers bind-mount work directories at the same path on the
      # daemon's host, so temporary files live on a volume both share.
      TMPDIR: /work
      DATADOUBLE_TEST_VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: datadouble-test
    # No bind mounts from the repository: on hosts whose home directories are
    # network mounts the Docker daemon cannot read them. Reports are copied out
    # of the stopped container instead (see `make test-integration`).
    volumes:
      - work:/work
      - jailer:/jailer:ro

  # PostgreSQL 18 with Pagila (dev/postgres).
  postgres:
    build:
      context: dev/postgres
    environment:
      POSTGRES_USER: datadouble
      POSTGRES_PASSWORD: datadouble
      POSTGRES_DB: datadouble
    healthcheck:
      # Ready only once the init scripts (Pagila) have finished.
      test: ["CMD-SHELL", "psql -U datadouble -d datadouble -tAc 'SELECT count(*) FROM public.audit_event' | grep -q 100"]
      interval: 2s
      timeout: 5s
      retries: 90

  # The shared Sakila fixture (dev/sakila). Docker fills the empty fixtures
  # volume from this image on first mount; database containers mount it
  # read-only and bulk-load from it, so the data is in no other image.
  fixtures:
    build:
      context: dev/sakila
    volumes:
      - fixtures:/fixtures

  # MySQL 8.4 with Sakila (dev/mysql), bulk-loaded from the fixture at start.
  mysql:
    build:
      context: dev/mysql
    depends_on:
      fixtures:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: datadouble
      MYSQL_USER: datadouble
      MYSQL_PASSWORD: datadouble
    volumes:
      - fixtures:/fixtures:ro
    healthcheck:
      # Ready only once the init scripts (Sakila) have finished.
      test: ["CMD-SHELL", "mysql -udatadouble -pdatadouble -N -e 'SELECT count(*) FROM sakila.audit_event' 2>/dev/null | grep -q 100"]
      interval: 2s
      timeout: 5s
      retries: 120

  # SQL Server 2022 (Developer edition) with Sakila (dev/mssql), bulk-loaded
  # from the fixture at start.
  mssql:
    build:
      context: dev/mssql
    depends_on:
      fixtures:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Datadouble-sa1
    volumes:
      - fixtures:/fixtures:ro
    healthcheck:
      # Ready only once Sakila and the awkward cases have loaded.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U datadouble -P Datadouble-1 -h -1 -W -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM sakila.dbo.audit_event' 2>/dev/null | grep -q '^100$$'"]
      interval: 2s
      timeout: 5s
      retries: 120

  # Jailer's export of dev/jailer/sakila.jm from the mysql service, for the
  # test comparing its key sets with Datadouble's. It runs once and exits.
  jailer:
    build:
      context: dev/jailer
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - jailer:/jailer-out

  # An S3-compatible object store (SeaweedFS) for the S3 storage adapter.
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # A Docker daemon for the Docker replicate adapter's tests, isolated from the
  # host's. It needs a privileged container.
  docker:
    image: docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The work volume is shared with the test runner, which writes as its own
    # user, as do the containers it starts.
    volumes:
      - work:/work
    entrypoint: ["sh", "-c", "chmod 1777 /work && exec dockerd-entrypoint.sh \"$$@\"", "--"]
    command: ["--host=tcp://0.0.0.0:2375"]
    healthcheck:
      test: ["CMD", "docker", "--host=tcp://127.0.0.1:2375", "info"]
      interval: 2s
      timeout: 5s
      retries: 60

  # OpenBao (API-compatible with HashiCorp Vault) in dev mode, for the vault
  # announce adapter. Dev mode keeps everything in memory, with a fixed token.
  vault:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-dev", "-dev-root-token-id=datadouble-test", "-dev-listen-address=0.0.0.0:8200"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      timeout: 5s
      retries: 60

  # MongoDB 9.0 with the generated cinema database (dev/mongodb), as a
  # single-node replica set, ready once seeded.
  mongodb:
    build:
      context: dev/mongodb
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  # Opt-in groups. Both need privileged containers.

  # k3s, for the Kubernetes adapters: `make test-k8s`.
  k3s:
    profiles: [k8s]
    image: rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
    hostname: k3s
    privileged: true
    # The work volume is shared with the test runner and reaches pods through
    # a hostPath PersistentVolume, as a work claim reaches Datadouble's pods.
    entrypoint: ["sh", "-c", "chmod 1777 /work && exec /bin/k3s \"$$@\"", "--"]
    command: ["server", "--disable=traefik,metrics-server", "--tls-san=k3s", "--write-kubeconfig-mode=644"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    volumes:
      - k3s-config:/output
      - k8s-work:/work
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 3s
      timeout: 5s
      retries: 60

  test-k8s:
    profiles: [k8s]
    build:
      context: .
      target: test
    user: tester
    depends_on:
      k3s:
        condition: service_healthy
    environment:
      TMPDIR: /work
    volumes:
      - k3s-config:/k3s:ro
      - k8s-work:/work
    command:
      - sh
      - -c
      - >-
        sed 's/127.0.0.1/k3s/' /k3s/kubeconfig.yaml > /tmp/kubeconfig
        && KUBECONFIG=/tmp/kubeconfig uv run pytest -m k8s adapters/kubernetes

  # A loop-mounted btrfs filesystem, for the btrfs replicate adapter:
  # `make test-btrfs`. Mounting needs root; the tests run as the test user.
  test-btrfs:
    profiles: [btrfs]
    build:
      context: .
      target: test
    privileged: true
    user: root
    command:
      - sh
      - -c
      - >-
        truncate -s 512M /tmp/btrfs.img
        && mkfs.btrfs -q /tmp/btrfs.img
        && mkdir -p /mnt/btrfs
        && mount -o loop,user_subvol_rm_allowed /tmp/btrfs.img /mnt/btrfs
        && chown tester:tester /mnt/btrfs
        && su -s /bin/sh tester -c
        'DATADOUBLE_TEST_BTRFS=/mnt/btrfs uv run pytest -m btrfs adapters/btrfs'

volumes:
  jailer:
  fixtures:
  work:
  k8s-work:
  k3s-config:
