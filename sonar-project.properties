sonar.organization=datadouble
sonar.projectKey=datadouble_datadouble
sonar.projectName=Datadouble
sonar.host.url=https://sonarcloud.io
sonar.sources=core/src,adapters/btrfs/src,adapters/docker/src,adapters/kubernetes/src,adapters/mongodb/src,adapters/mssql/src,adapters/mysql/src,adapters/postgres/src,adapters/s3/src,adapters/vault/src,conformance/src,scripts
sonar.tests=core/tests,adapters/btrfs/tests,adapters/docker/tests,adapters/kubernetes/tests,adapters/mongodb/tests,adapters/mssql/tests,adapters/mysql/tests,adapters/postgres/tests,adapters/s3/tests,adapters/vault/tests,conformance/tests,tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
# The scan waits for the quality gate and fails the required `sonar` job when
# it fails, so a red gate blocks the merge.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
