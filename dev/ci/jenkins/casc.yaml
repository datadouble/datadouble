# The test Jenkins: one administrator, and the built-in node running jobs
# labelled as both of the suite's runners.
jenkins:
  systemMessage: Datadouble CI/CD conformance
  numExecutors: 2
  labelString: "prod-db staging"
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${DDCI_JENKINS_PASSWORD}"
  authorizationStrategy: loggedInUsersCanDoAnything
