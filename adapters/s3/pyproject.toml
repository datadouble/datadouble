[project]
name = "datadouble-s3"
# All packages share one version until 1.0 (decision 38); scripts/make_tag.py
# sets it at release time.
version = "0.0.0"
description = "S3 storage adapter for Datadouble"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tight Line LLC" }]
requires-python = ">=3.13"
dependencies = ["datadouble", "boto3>=1.40"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://datadouble.tightlinesoftware.com/"
Source = "https://github.com/datadouble/datadouble"

[project.entry-points."datadouble.stores"]
s3 = "datadouble_s3:s3_store"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datadouble_s3"]
